[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fapix"
version = "0.1.0"
description = "A CLI tool to manage FastAPI projects with Django-like structure"
authors = [
  { name="Hashim Ali", email="devhashim111@gmail.com" }
]
requires-python = ">=3.7"
dependencies = [
    "click>=8.1.3",
    "jinja2>=3.1.2",
    "tortoise-orm>=0.19.2",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0"
]

[project.scripts]
fapix = "fapix.core.cli.main:cli"


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fapix"
version = "0.1.2"
description = "A batteries included DRF like toolkit on fastapi"
authors = [
  { name="Hashim Ali", email="devhashim111@gmail.com" }
]
requires-python = ">=3.7"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }

dependencies = [
    "click>=8.1.3",
    "jinja2>=3.1.2",
    "tortoise-orm>=0.19.2",
    "aerich",
    "python-jose[cryptography]",
    "fastapi",
    "uvicorn",
    "typer",
    "passlib",
    "pydantic[email]",
    "bcrypt==4.0.1",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fapix*"]

[project.urls]

Documentation = "https://devHashim111.github.io/fapix/"
Homepage = "https://github.com/devHashim111/fapix"
"
[project.scripts]
fapix = "fapix.core.cli.main:cli"